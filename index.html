<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Dexter Smith | Game Developer & Creator</title>
    <link rel="icon" type="image/png" href="images/misc/main-icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- Load data files -->
    <script src="data/profile.js"></script>
    <script src="data/skills.js"></script>
    <script src="data/socials.js"></script>
    <script src="data/games.js"></script>
    <script src="data/projects.js"></script>
    <script src="data/photos.js"></script>
</head>
<body>
    <!-- Page Wrapper for shake effect -->
    <div class="page-wrapper" id="pageWrapper">

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-brand">Dexo.<span id="navBrandSuffix">Games</span></div>
        <ul class="nav-links">
            <li><a href="#about">About</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#games">Games</a></li>
            <li><a href="#photos">Photos</a></li>
            <li><a href="#contact">Contact</a></li>
            <li>
                <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
            </li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <header class="hero" id="hero">
        <div class="hero-content">
            <div class="profile-image">
                <img id="heroPhoto" src="" alt="">
            </div>
            <h1 id="heroName"></h1>
            <p class="tagline" id="heroTagline"></p>
            <p class="hero-description" id="heroBio"></p>
            <div class="social-links" id="heroSocials">
                <!-- Loaded dynamically from data/socials.js -->
            </div>
        </div>
    </header>

    <!-- Featured Projects Carousel -->
    <section class="section featured" id="featured">
        <h2 class="section-title">Featured Work</h2>
        <div class="featured-carousel">
            <button class="carousel-btn prev" id="carouselPrev">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="featured-card" id="featuredCard">
                <!-- Loaded dynamically -->
            </div>
            <button class="carousel-btn next" id="carouselNext">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
        <div class="carousel-dots" id="carouselDots"></div>
    </section>

    <!-- About Section -->
    <section class="section about" id="about">
        <h2 class="section-title">About Me</h2>
        <div class="about-content">
            <div class="about-text" id="aboutText">
                <!-- Loaded dynamically from data/profile.js -->
            </div>
        </div>
    </section>

    <!-- Games Section -->
    <section class="section games" id="games">
        <h2 class="section-title">My Games</h2>
        <div class="projects-grid" id="gamesGrid">
            <!-- Games are loaded dynamically from data/games.json -->
            <p class="loading-text">Loading games...</p>
        </div>
    </section>

    <!-- Other Projects Section -->
    <section class="section projects" id="projects">
        <h2 class="section-title">Other Projects</h2>
        <div class="projects-grid" id="projectsGrid">
            <p class="loading-text">Loading projects...</p>
        </div>
    </section>

    <!-- Dexo Photos Section -->
    <section class="section photos" id="photos">
        <h2 class="section-title">Dexo Photos</h2>
        <div class="photos-scroll-wrapper">
            <div class="photos-scroll-track" id="photosTrack">
                <!-- Loaded dynamically from data/photos.js -->
            </div>
        </div>
        <div class="photos-btn-wrapper">
            <a href="photos.html" class="view-more-btn">
                <span>View All Photos</span>
                <i class="fas fa-arrow-right"></i>
            </a>
        </div>
    </section>

    <!-- Contact Section -->
    <section class="section contact" id="contact">
        <h2 class="section-title">Get In Touch</h2>
        <div class="contact-content">
            <p>Interested in working together or just want to say hi? Feel free to reach out!</p>
            <div class="contact-methods" id="contactMethods">
                <!-- Loaded dynamically from data/socials.js -->
            </div>
            <div class="social-links large" id="contactSocials">
                <!-- Loaded dynamically from data/socials.js -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <p id="footerCopyright"></p>
        <p id="footerText"></p>
    </footer>

    </div><!-- End page-wrapper -->

    <!-- Bomb script - shared across all pages -->
    <script src="bomb.js"></script>

    <script>
        // ==========================================
        // NAV BRAND TYPING ANIMATION
        // ==========================================
        const navBrandSuffix = document.getElementById('navBrandSuffix');
        const suffixes = ['Games', 'Software', 'Photos', "Smith"];
        const holdTimes = [7000, 2000, 2000, 2000, 2000]; // Games holds longer
        let currentSuffixIndex = 0;
        
        function typeText(text, callback) {
            let i = 0;
            navBrandSuffix.textContent = '';
            const typeInterval = setInterval(() => {
                navBrandSuffix.textContent += text[i];
                i++;
                if (i >= text.length) {
                    clearInterval(typeInterval);
                    if (callback) callback();
                }
            }, 100); // Typing speed
        }
        
        function deleteText(callback) {
            const deleteInterval = setInterval(() => {
                const currentText = navBrandSuffix.textContent;
                if (currentText.length > 0) {
                    navBrandSuffix.textContent = currentText.slice(0, -1);
                } else {
                    clearInterval(deleteInterval);
                    if (callback) callback();
                }
            }, 50); // Deleting speed (faster)
        }
        
        function cycleNavBrand() {
            const holdTime = holdTimes[currentSuffixIndex];
            
            setTimeout(() => {
                deleteText(() => {
                    currentSuffixIndex = (currentSuffixIndex + 1) % suffixes.length;
                    setTimeout(() => {
                        typeText(suffixes[currentSuffixIndex], cycleNavBrand);
                    }, 300); // Pause before typing new word
                });
            }, holdTime);
        }
        
        // Start the animation cycle
        cycleNavBrand();

        // ==========================================
        // THEME TOGGLE
        // ==========================================
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;
        
        // Check for saved theme preference or default to dark
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            html.setAttribute('data-theme', 'light');
            themeIcon.classList.remove('fa-moon');
            themeIcon.classList.add('fa-sun');
        }
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            if (currentTheme === 'light') {
                html.removeAttribute('data-theme');
                localStorage.setItem('theme', 'dark');
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            } else {
                html.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            }
        });

        // ==========================================
        // SMOOTH SCROLLING
        // ==========================================
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });
        
        // ==========================================
        // NAVBAR SCROLL EFFECT
        // ==========================================
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // ==========================================
        // DYNAMIC CONTENT LOADING
        // ==========================================
        
        // Create a game card HTML
        function createGameCard(game) {
            const tagsHTML = game.tags.map(tag => `<span>${tag}</span>`).join('');
            const devBadge = game.inDevelopment ? '<span class="dev-badge inline"><i class="fas fa-code"></i> In Development</span>' : '';
            const platformLabel = game.platform === 'mobile' ? 'Mobile Game' : game.platform === 'pc' ? 'PC Game' : 'Game';
            
            return `
                <div class="project-card ${game.inDevelopment ? 'in-development' : ''}" data-id="${game.id}">
                    <div class="project-image">
                        <img src="${game.image}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/400x400?text=${encodeURIComponent(game.title)}'">
                    </div>
                    <div class="project-info">
                        <div class="project-title-row">
                            <h3>${game.title}</h3>
                            ${devBadge}
                        </div>
                        <span class="project-type">${platformLabel}</span>
                        <p class="project-description">${game.description}</p>
                        <div class="project-tags">${tagsHTML}</div>
                        <div class="project-links">
                            ${game.links.play ? `<a href="${game.links.play}" class="btn btn-primary" target="_blank" rel="noopener noreferrer">Play Now</a>` : ''}
                            ${game.links.source ? `<a href="${game.links.source}" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">View Source</a>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // Create a project card HTML
        function createProjectCard(project) {
            const tagsHTML = project.tags.map(tag => `<span>${tag}</span>`).join('');
            let badgeHTML = '';
            if (project.badge) {
                const icon = project.badge.icon || 'fa-star';
                badgeHTML = `<span class="dev-badge inline"><i class="fas ${icon}"></i> ${project.badge.text}</span>`;
            } else if (project.inDevelopment) {
                badgeHTML = '<span class="dev-badge inline"><i class="fas fa-code"></i> In Development</span>';
            }
            const subtext = project.subtext || 'Project';
            
            return `
                <div class="project-card ${project.inDevelopment ? 'in-development' : ''}" data-id="${project.id}">
                    <div class="project-image">
                        <img src="${project.image}" alt="${project.title}" onerror="this.src='https://via.placeholder.com/400x400?text=${encodeURIComponent(project.title)}'">
                    </div>
                    <div class="project-info">
                        <div class="project-title-row">
                            <h3>${project.title}</h3>
                            ${badgeHTML}
                        </div>
                        <span class="project-type">${subtext}</span>
                        <p class="project-description">${project.description}</p>
                        <div class="project-tags">${tagsHTML}</div>
                        <div class="project-links">
                            ${project.links.play ? `<a href="${project.links.play}" class="btn btn-primary" target="_blank" rel="noopener noreferrer">Play Now</a>` : ''}
                            ${project.links.demo ? `<a href="${project.links.demo}" class="btn btn-primary" target="_blank" rel="noopener noreferrer">Live Demo</a>` : ''}
                            ${project.links.github ? `<a href="${project.links.github}" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">GitHub</a>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // Load games from data file
        function loadGames() {
            const gamesGrid = document.getElementById('gamesGrid');
            
            if (!GAMES_DATA || GAMES_DATA.length === 0) {
                gamesGrid.innerHTML = '<p class="no-content">No games yet - check back soon!</p>';
                return;
            }
            
            gamesGrid.innerHTML = GAMES_DATA.map(createGameCard).join('');
        }

        // Load projects from data file
        function loadProjects() {
            const projectsGrid = document.getElementById('projectsGrid');
            
            if (!PROJECTS_DATA || PROJECTS_DATA.length === 0) {
                projectsGrid.innerHTML = '<p class="no-content">No projects yet - check back soon!</p>';
                return;
            }
            
            projectsGrid.innerHTML = PROJECTS_DATA.map(createProjectCard).join('');
        }

        // ==========================================
        // FEATURED CAROUSEL
        // ==========================================
        
        let featuredItems = [];
        let currentFeaturedIndex = 0;
        let carouselInterval;
        
        function createFeaturedCard(item, isGame = false) {
            let badgeHTML = '';
            if (item.badge) {
                const icon = item.badge.icon || 'fa-star';
                badgeHTML = `<span class="dev-badge"><i class="fas ${icon}"></i> ${item.badge.text}</span>`;
            } else if (item.inDevelopment) {
                badgeHTML = '<span class="dev-badge"><i class="fas fa-code"></i> In Development</span>';
            }
            
            let typeLabel = '';
            if (isGame) {
                const platformLabel = item.platform === 'mobile' ? 'Mobile Game' : item.platform === 'pc' ? 'PC Game' : 'Game';
                typeLabel = platformLabel;
            } else {
                typeLabel = item.subtext || 'Project';
            }
            const tagsHTML = item.tags.map(tag => `<span>${tag}</span>`).join('');
            
            let linksHTML = '';
            if (isGame) {
                linksHTML = `
                    ${item.links.play ? `<a href="${item.links.play}" class="btn btn-primary" target="_blank" rel="noopener noreferrer">Play Now</a>` : ''}
                    ${item.links.source ? `<a href="${item.links.source}" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">View Source</a>` : ''}
                `;
            } else {
                linksHTML = `
                    ${item.links.play ? `<a href="${item.links.play}" class="btn btn-primary" target="_blank" rel="noopener noreferrer">Play Now</a>` : ''}
                    ${item.links.demo ? `<a href="${item.links.demo}" class="btn btn-primary" target="_blank" rel="noopener noreferrer">Live Demo</a>` : ''}
                    ${item.links.github ? `<a href="${item.links.github}" class="btn btn-secondary" target="_blank">GitHub</a>` : ''}
                `;
            }
            
            return `
                <div class="featured-content ${item.inDevelopment ? 'in-development' : ''}">
                    <div class="featured-image">
                        <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/400x400?text=${encodeURIComponent(item.title)}'">
                    </div>
                    <div class="featured-info">
                        <div class="featured-title-row">
                            <h3>${item.title}</h3>
                            ${badgeHTML}
                        </div>
                        <span class="featured-type">${typeLabel}</span>
                        <p class="project-description">${item.description}</p>
                        <div class="project-tags">${tagsHTML}</div>
                        <div class="project-links">${linksHTML}</div>
                    </div>
                </div>
            `;
        }
        
        function loadFeaturedCarousel() {
            // Collect all featured items
            featuredItems = [];
            
            if (typeof GAMES_DATA !== 'undefined' && GAMES_DATA) {
                GAMES_DATA.filter(g => g.featured).forEach(g => {
                    featuredItems.push({ ...g, isGame: true });
                });
            }
            // Only include projects if PROJECTS_DATA is defined
            if (typeof PROJECTS_DATA !== 'undefined' && PROJECTS_DATA) {
                PROJECTS_DATA.filter(p => p.featured).forEach(p => {
                    featuredItems.push({ ...p, isGame: false });
                });
            }
            
            // Sort by featuredOrder (lower numbers first)
            featuredItems.sort((a, b) => {
                const orderA = a.featuredOrder || 999;
                const orderB = b.featuredOrder || 999;
                return orderA - orderB;
            });
            
            if (featuredItems.length === 0) {
                document.getElementById('featured').style.display = 'none';
                return;
            }
            
            // Create dots
            const dotsContainer = document.getElementById('carouselDots');
            dotsContainer.innerHTML = featuredItems.map((_, i) => 
                `<button class="carousel-dot ${i === 0 ? 'active' : ''}" data-index="${i}"></button>`
            ).join('');
            
            // Add dot click listeners
            dotsContainer.querySelectorAll('.carousel-dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    goToFeatured(parseInt(dot.dataset.index));
                });
            });
            
            // Show first item
            showFeatured(0);
            
            // Auto-rotate every 6 seconds
            startCarouselAutoRotate();
            
            // Pause on hover
            const carousel = document.querySelector('.featured-carousel');
            carousel.addEventListener('mouseenter', () => clearInterval(carouselInterval));
            carousel.addEventListener('mouseleave', startCarouselAutoRotate);
        }
        
        function startCarouselAutoRotate() {
            clearInterval(carouselInterval);
            carouselInterval = setInterval(() => {
                currentFeaturedIndex = (currentFeaturedIndex + 1) % featuredItems.length;
                showFeatured(currentFeaturedIndex);
            }, 6000);
        }
        
        function showFeatured(index) {
            const item = featuredItems[index];
            const card = document.getElementById('featuredCard');
            card.innerHTML = createFeaturedCard(item, item.isGame);
            
            // Update dots
            document.querySelectorAll('.carousel-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        }
        
        function goToFeatured(index) {
            currentFeaturedIndex = index;
            showFeatured(index);
            startCarouselAutoRotate();
        }
        
        // Carousel navigation
        document.getElementById('carouselPrev').addEventListener('click', () => {
            currentFeaturedIndex = (currentFeaturedIndex - 1 + featuredItems.length) % featuredItems.length;
            goToFeatured(currentFeaturedIndex);
        });
        
        document.getElementById('carouselNext').addEventListener('click', () => {
            currentFeaturedIndex = (currentFeaturedIndex + 1) % featuredItems.length;
            goToFeatured(currentFeaturedIndex);
        });

        // ==========================================
        // PHOTOS SECTION
        // ==========================================
        
        function loadPhotos() {
            const track = document.getElementById('photosTrack');
            
            if (!PHOTOS_DATA || !PHOTOS_DATA.featured || PHOTOS_DATA.featured.length === 0) {
                document.getElementById('photos').style.display = 'none';
                return;
            }
            
            // Duplicate photos for seamless infinite scroll
            const photos = [...PHOTOS_DATA.featured, ...PHOTOS_DATA.featured];
            
            track.innerHTML = photos.map(photo => `
                <div class="photo-item">
                    <img src="${encodeURI(photo.image)}" alt="${photo.alt}" onerror="this.src='https://via.placeholder.com/300x200?text=${encodeURIComponent(photo.title)}'">
                    <div class="photo-overlay">
                        <span>${photo.title}</span>
                    </div>
                </div>
            `).join('');
        }

        // ==========================================
        // PROFILE & SOCIAL LINKS LOADING
        // ==========================================
        
        // Load profile data into hero section
        function loadProfile() {
            if (!PROFILE_DATA) return;
            
            // Hero section
            document.getElementById('heroPhoto').src = PROFILE_DATA.photo;
            document.getElementById('heroPhoto').alt = PROFILE_DATA.name;
            document.getElementById('heroName').textContent = PROFILE_DATA.name;
            document.getElementById('heroTagline').textContent = PROFILE_DATA.tagline;
            document.getElementById('heroBio').textContent = PROFILE_DATA.heroBio;
            
            // Footer
            document.getElementById('footerCopyright').innerHTML = `&copy; ${PROFILE_DATA.footerYear} ${PROFILE_DATA.name}. All rights reserved.`;
            document.getElementById('footerText').textContent = PROFILE_DATA.footerText;
        }
        
        // Load about section
        function loadAbout() {
            const aboutText = document.getElementById('aboutText');
            if (!PROFILE_DATA) return;
            
            // Generate paragraphs
            const paragraphsHTML = PROFILE_DATA.aboutParagraphs
                .map(p => `<p>${p}</p>`)
                .join('');
            
            // Generate skills by category
            let skillsHTML = '';
            if (SKILLS_DATA && typeof SKILLS_DATA === 'object') {
                Object.keys(SKILLS_DATA).forEach(categoryKey => {
                    const category = SKILLS_DATA[categoryKey];
                    if (category.skills && category.skills.length > 0) {
                        const tagsHTML = category.skills
                            .map(skill => `<span class="skill-tag">${skill}</span>`)
                            .join('');
                        skillsHTML += `
                            <div class="skill-category" data-category="${categoryKey}">
                                <h4>${category.title}</h4>
                                <div class="skills-container">${tagsHTML}</div>
                            </div>
                        `;
                    }
                });
            }
            
            if (!skillsHTML) {
                skillsHTML = '<div class="skills-container"><span class="skill-tag">No skills listed</span></div>';
            }
            
            aboutText.innerHTML = `
                ${paragraphsHTML}
                <h3>Skills & Technologies</h3>
                <div class="skills-all">${skillsHTML}</div>
            `;
        }
        
        // Generate social link HTML
        function createSocialLink(social, showLabel = false) {
            if (!social.url) return '';
            const iconHTML = social.customImage 
                ? `<img src="${social.icon}" alt="${social.name}" class="social-custom-icon">` 
                : `<i class="${social.icon}"></i>`;
            return `
                <a href="${social.url}" target="_blank" rel="noopener noreferrer" title="${social.name}">
                    ${iconHTML}${showLabel ? `<span>${social.name}</span>` : ''}
                </a>
            `;
        }
        
        // Load social links
        function loadSocials() {
            if (!SOCIALS_DATA) return;
            
            const heroSocials = document.getElementById('heroSocials');
            const contactSocials = document.getElementById('contactSocials');
            const contactMethods = document.getElementById('contactMethods');
            
            // Filter out socials with no URL
            const activeSocials = SOCIALS_DATA.filter(s => s.url);
            
            // Hero social links (icons only)
            heroSocials.innerHTML = activeSocials.map(s => createSocialLink(s)).join('');
            
            // Contact section social links (icons only)
            contactSocials.innerHTML = activeSocials.map(s => createSocialLink(s)).join('');
            
            // Contact methods (email + selected socials with labels)
            let methodsHTML = '';
            
            // Add email first
            if (PROFILE_DATA && PROFILE_DATA.email) {
                methodsHTML += `
                    <a href="mailto:${PROFILE_DATA.email}" class="contact-item">
                        <i class="fas fa-envelope"></i>
                        <span>${PROFILE_DATA.email}</span>
                    </a>
                `;
            }
            
            // Add selected contact methods
            if (CONTACT_METHODS) {
                CONTACT_METHODS.forEach(methodId => {
                    const social = SOCIALS_DATA.find(s => s.id === methodId);
                    if (social && social.url) {
                        const iconHTML = social.customImage 
                            ? `<img src="${social.icon}" alt="${social.name}" class="social-custom-icon">` 
                            : `<i class="${social.icon}"></i>`;
                        methodsHTML += `
                            <a href="${social.url}" target="_blank" rel="noopener noreferrer" class="contact-item">
                                ${iconHTML}
                                <span>${social.name}</span>
                            </a>
                        `;
                    }
                });
            }
            
            contactMethods.innerHTML = methodsHTML;
        }

        // Load content when page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadProfile();
            loadAbout();
            loadSocials();
            loadFeaturedCarousel();
            loadGames();
            loadProjects();
            loadPhotos();
        });
    </script>
</body>
</html>
